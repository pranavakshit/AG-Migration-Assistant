[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-migration-assistant"
version = "0.1.0"
description = "Recovery helper for Antigravity chat history migration."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
license = { text = "MIT" }

[project.scripts]
ag-migration-assistant = "ag_migration_assistant.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

