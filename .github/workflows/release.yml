name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2022
            python-arch: x86
            artifact-name: ag-migration-assistant-win-x86
          - runs-on: windows-2022
            python-arch: x64
            artifact-name: ag-migration-assistant-win-x64
          - runs-on: windows-11-arm
            python-arch: arm64
            artifact-name: ag-migration-assistant-win-arm64

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name ag-migration-assistant src/ag_migration_assistant/__main__.py

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/ag-migration-assistant.exe "release/${{ matrix.artifact-name }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release/${{ matrix.artifact-name }}.exe

  publish:
    needs: build
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ag-migration-assistant-win-x86/ag-migration-assistant-win-x86.exe
            release-assets/ag-migration-assistant-win-x64/ag-migration-assistant-win-x64.exe
            release-assets/ag-migration-assistant-win-arm64/ag-migration-assistant-win-arm64.exe
          generate_release_notes: true
